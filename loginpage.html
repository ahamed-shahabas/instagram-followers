<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f1117;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    padding:20px;
}

.login-box{
    width:350px;
    background:#171923;
    border-radius:20px;
    padding:35px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:white;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#1f2330;
    color:white;
    font-size:15px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(
        90deg,
        #833ab4,
        #fd1d1d,
        #fcb045
    );
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.text{
    text-align:center;
    color:#aaa;
    margin-top:15px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="login-box">

<h2>Login</h2>

<input
type="text"
placeholder="Instagram username">

<input
type="password"
placeholder="Password">

<button onclick="goBack()">
Login
</button>

<div class="text">
FollowerHub Access
</div>

</div>

<script>
function goBack(){
    window.location.href="index.html";
}
</script>

</body>
</html>
